{% extends "base.html" %}
{% block title %}Server Error{% endblock %}
{% block content %}
<div class="d-flex flex-column align-items-center justify-content-center text-center" style="min-height: 60vh;">
    <i class="fas fa-server fa-4x text-danger opacity-50 mb-4"></i>
    <h2 class="fw-bold">500 — Internal Server Error</h2>
    <p class="text-secondary">Something went wrong on our end. Please try again.</p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary rounded-pill px-4 mt-2">Back to Insights</a>
</div>
{% endblock %}
