<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Revenue AI{% endblock %} | Hotel RMS</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-light">
    <!-- Sidebar / Navigation -->
    <div class="d-flex" id="wrapper">
        <div class="bg-dark text-white border-end" id="sidebar-wrapper">
            <div class="sidebar-heading border-bottom p-4">
                <i class="fas fa-hotel me-2"></i><strong>Revenue AI</strong>
            </div>
            <div class="list-group list-group-flush">
                <a href="{{ url_for('main.index') }}" class="list-group-item list-group-item-action bg-dark text-white p-3">
                    <i class="fas fa-home me-2"></i> Insights
                </a>
                <a href="{{ url_for('main.dashboard') }}" class="list-group-item list-group-item-action bg-dark text-white p-3">
                    <i class="fas fa-chart-line me-2"></i> Dashboard
                </a>
                <a href="{{ url_for('main.recommendations') }}" class="list-group-item list-group-item-action bg-dark text-white p-3">
                    <i class="fas fa-brain me-2"></i> AI Recommendations
                </a>
                <a href="{{ url_for('main.simulator') }}" class="list-group-item list-group-item-action bg-dark text-white p-3">
                    <i class="fas fa-vials me-2"></i> What-If Simulator
                </a>
                <a href="{{ url_for('main.events') }}" class="list-group-item list-group-item-action bg-dark text-white p-3">
                    <i class="fas fa-calendar-alt me-2"></i> Event Calendar
                </a>
            </div>
        </div>

        <!-- Page Content -->
        <div id="page-content-wrapper" class="w-100">
            <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom p-3 shadow-sm">
                <div class="container-fluid">
                    <button class="btn btn-outline-secondary btn-sm" id="sidebarToggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div class="ms-auto d-flex align-items-center">
                        <span class="badge bg-success me-3"><i class="fas fa-check-circle me-1"></i> RL Agent Active</span>
                        <div class="dropdown">
                            <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown">
                                <i class="fas fa-user-circle me-1"></i> Revenue Manager
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li><a class="dropdown-item" href="#">Settings</a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item" href="#">Logout</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </nav>

            <div class="container-fluid p-4">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
